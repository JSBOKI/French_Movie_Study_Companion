# Bobine on Render. One web service, one disk, no extra workers (SQLite).
services:
  - type: web
    name: bobine
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATA_DIR
        value: /var/data
      - key: APP_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
